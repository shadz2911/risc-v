<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 710" width="1400" height="710" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a-dp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
    <marker id="a-fw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker>
    <marker id="a-wb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="a-ct" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="a-bp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
    <style>
      .box  { fill: #f8fafc; stroke: #475569; stroke-width: 1.5; }
      .fwb  { fill: #fff7ed; stroke: #d97706; stroke-width: 1.5; }
      .ctb  { fill: #fef2f2; stroke: #dc2626; stroke-width: 1.5; }
      .bpb  { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 1.5; }
      .bar  { fill: #e2e8f0; stroke: #64748b; stroke-width: 1.2; }
      .lbl  { font-size: 13px; fill: #111827; text-anchor: middle; }
      .sm   { font-size: 10.5px; fill: #4b5563; text-anchor: middle; }
      .wl   { font-size: 10.5px; fill: #374151; }
      .stg  { font-size: 15px; font-weight: bold; fill: #1f2937; text-anchor: middle; }
      .barl { font-size: 11px; font-weight: bold; fill: #334155; text-anchor: middle; }
      .dp { fill: none; stroke: #374151; stroke-width: 1.6; marker-end: url(#a-dp); }
      .fw { fill: none; stroke: #d97706; stroke-width: 1.8; marker-end: url(#a-fw); }
      .wb { fill: none; stroke: #2563eb; stroke-width: 1.8; marker-end: url(#a-wb); }
      .ct { fill: none; stroke: #dc2626; stroke-width: 1.6; stroke-dasharray: 6 4; marker-end: url(#a-ct); }
      .bp { fill: none; stroke: #7c3aed; stroke-width: 1.6; stroke-dasharray: 6 4; marker-end: url(#a-bp); }
    </style>
  </defs>

  <rect x="0" y="0" width="1400" height="710" fill="#ffffff"/>

  <text x="24" y="34" font-size="20" font-weight="bold" fill="#111827">5-stage pipelined RV32I core</text>
  <text x="24" y="56" font-size="12.5" fill="#4b5563">Forwarding, load-use stalling, and dynamic branch prediction with flush-on-mispredict</text>

  <!-- stage headers -->
  <text class="stg" x="155" y="100">IF · Fetch</text>
  <text class="stg" x="452" y="100">ID · Decode</text>
  <text class="stg" x="802" y="100">EX · Execute</text>
  <text class="stg" x="1102" y="100">MEM</text>
  <text class="stg" x="1297" y="100">WB</text>

  <!-- pipeline registers -->
  <rect class="bar" x="290" y="130" width="24" height="430" rx="3"/>
  <rect class="bar" x="590" y="130" width="24" height="430" rx="3"/>
  <rect class="bar" x="990" y="130" width="24" height="430" rx="3"/>
  <rect class="bar" x="1190" y="130" width="24" height="430" rx="3"/>
  <text class="barl" transform="translate(306,250) rotate(-90)">IF / ID</text>
  <text class="barl" transform="translate(606,250) rotate(-90)">ID / EX</text>
  <text class="barl" transform="translate(1006,250) rotate(-90)">EX / MEM</text>
  <text class="barl" transform="translate(1206,250) rotate(-90)">MEM / WB</text>

  <!-- ================= IF ================= -->
  <rect class="box" x="40" y="300" width="50" height="80" rx="4"/>
  <text class="lbl" x="65" y="336">Next</text>
  <text class="lbl" x="65" y="352">PC</text>

  <rect class="box" x="110" y="310" width="60" height="60" rx="4"/>
  <text class="lbl" x="140" y="345">PC</text>

  <rect class="box" x="100" y="200" width="50" height="40" rx="4"/>
  <text class="lbl" x="125" y="225">+4</text>

  <rect class="box" x="185" y="280" width="90" height="120" rx="4"/>
  <text class="lbl" x="230" y="334">Instruction</text>
  <text class="lbl" x="230" y="350">Memory</text>

  <rect x="35" y="460" width="240" height="80" rx="6" fill="none" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text class="sm" x="155" y="474" fill="#7c3aed">branch predictor</text>
  <rect class="bpb" x="45" y="482" width="100" height="48" rx="4"/>
  <text class="lbl" x="95" y="502">PHT</text>
  <text class="sm" x="95" y="519">32 × 2-bit</text>
  <rect class="bpb" x="160" y="482" width="105" height="48" rx="4"/>
  <text class="lbl" x="212" y="502">BTB</text>
  <text class="sm" x="212" y="519">16 entries, tagged</text>

  <path class="dp" d="M90,340 L108,340"/>
  <path class="dp" d="M170,340 L183,340"/>
  <path class="dp" d="M125,310 L125,242"/>
  <path class="dp" d="M100,220 L65,220 L65,298"/>
  <path class="dp" d="M275,340 L288,340"/>
  <path class="dp" d="M140,370 L140,458"/>
  <path class="bp" d="M65,460 L65,382"/>
  <text class="wl" x="70" y="430" fill="#7c3aed">predict</text>

  <!-- ================= ID ================= -->
  <rect class="box" x="340" y="130" width="110" height="50" rx="4"/>
  <text class="lbl" x="395" y="160">Control</text>

  <rect class="ctb" x="460" y="195" width="110" height="45" rx="4"/>
  <text class="lbl" x="515" y="214">Load-use</text>
  <text class="lbl" x="515" y="230">hazard detect</text>

  <rect class="box" x="380" y="280" width="120" height="120" rx="4"/>
  <text class="lbl" x="440" y="336">Register</text>
  <text class="lbl" x="440" y="352">File</text>
  <text class="sm" x="394" y="389">wd</text>

  <rect class="box" x="380" y="440" width="120" height="45" rx="4"/>
  <text class="lbl" x="440" y="467">Imm Gen</text>

  <path class="dp" d="M314,340 L355,340"/>
  <path class="dp" d="M355,340 L355,182"/>
  <path class="dp" d="M355,340 L378,340"/>
  <path class="dp" d="M355,340 L355,462 L378,462"/>
  <circle cx="355" cy="340" r="3" fill="#374151"/>
  <text class="wl" x="320" y="333">instr</text>

  <path class="dp" d="M450,155 L588,155"/>
  <text class="wl" x="520" y="149">ctrl</text>
  <path class="dp" d="M500,320 L588,320"/>
  <text class="wl" x="530" y="314">rd1</text>
  <path class="dp" d="M500,370 L588,370"/>
  <text class="wl" x="530" y="364">rd2</text>
  <path class="dp" d="M500,462 L588,462"/>
  <text class="wl" x="530" y="456">imm</text>

  <!-- ================= EX ================= -->
  <polygon class="box" points="635,290 675,302 675,338 635,350"/>
  <text class="sm" x="655" y="283">rs1 | PC</text>
  <polygon class="box" points="635,360 675,375 675,455 635,470"/>
  <text class="sm" x="655" y="483">rs2 | imm</text>

  <path class="dp" d="M614,320 L633,320"/>
  <path class="dp" d="M614,370 L633,370"/>
  <path class="dp" d="M614,462 L633,462"/>

  <rect class="fwb" x="695" y="280" width="80" height="180" rx="4"/>
  <text class="lbl" x="735" y="362">Forward</text>
  <text class="lbl" x="735" y="378">Mux</text>

  <rect class="fwb" x="745" y="505" width="90" height="45" rx="4"/>
  <text class="lbl" x="790" y="524">Forward</text>
  <text class="lbl" x="790" y="540">Unit</text>
  <path class="fw" d="M760,505 L760,462"/>
  <text class="wl" x="764" y="494" fill="#d97706">sel</text>

  <path class="dp" d="M675,320 L693,320"/>
  <path class="dp" d="M675,415 L693,415"/>

  <rect class="box" x="800" y="200" width="70" height="40" rx="4"/>
  <text class="lbl" x="835" y="225">ALU ctrl</text>
  <path class="dp" d="M835,240 L835,288"/>

  <rect class="box" x="800" y="290" width="70" height="110" rx="4"/>
  <text class="lbl" x="835" y="350">ALU</text>

  <rect class="box" x="800" y="420" width="70" height="40" rx="4"/>
  <text class="lbl" x="835" y="445">a == b</text>

  <path class="dp" d="M775,322 L798,322"/>
  <path class="dp" d="M775,375 L798,375"/>
  <path class="dp" d="M775,440 L798,440"/>

  <rect class="box" x="890" y="170" width="80" height="40" rx="4"/>
  <text class="lbl" x="930" y="195">PC + imm</text>
  <rect class="box" x="890" y="230" width="80" height="40" rx="4"/>
  <text class="lbl" x="930" y="255">Target</text>
  <path class="dp" d="M930,210 L930,228"/>

  <path class="dp" d="M870,345 L988,345"/>
  <path class="dp" d="M880,345 L880,250 L888,250"/>
  <circle cx="880" cy="345" r="3" fill="#374151"/>
  <text class="wl" x="940" y="339">alu result</text>
  <text class="sm" x="868" y="265">jalr</text>

  <rect class="ctb" x="890" y="420" width="80" height="60" rx="4"/>
  <text class="lbl" x="930" y="446">Branch</text>
  <text class="lbl" x="930" y="462">resolve</text>
  <path class="dp" d="M930,270 L930,418"/>
  <path class="dp" d="M870,440 L888,440"/>

  <path class="dp" d="M775,452 L785,452 L785,488 L988,488"/>
  <text class="wl" x="800" y="482">store data</text>

  <!-- ================= MEM ================= -->
  <rect class="box" x="1040" y="290" width="110" height="120" rx="4"/>
  <text class="lbl" x="1108" y="346">Data</text>
  <text class="lbl" x="1108" y="362">Memory</text>
  <text class="sm" x="1058" y="341">addr</text>
  <text class="sm" x="1054" y="381">wd</text>

  <path class="dp" d="M1014,345 L1038,345"/>
  <path class="dp" d="M1014,488 L1025,488 L1025,385 L1038,385"/>
  <path class="dp" d="M1150,350 L1188,350"/>

  <rect class="fwb" x="1040" y="470" width="110" height="45" rx="4"/>
  <path class="dp" d="M1014,505 L1038,505"/>
  <text class="lbl" x="1095" y="489">Result select</text>
  <text class="sm" x="1095" y="505">(value to forward)</text>

  <!-- ================= WB ================= -->
  <rect class="box" x="1250" y="290" width="90" height="120" rx="4"/>
  <text class="lbl" x="1295" y="346">Writeback</text>
  <text class="lbl" x="1295" y="362">Mux</text>
  <text class="sm" x="1295" y="282">alu | mem | pc+4 | imm</text>
  <path class="dp" d="M1214,350 L1248,350"/>

  <!-- ================= feedback lanes ================= -->
  <path class="fw" d="M1095,515 L1095,575 L710,575 L710,462"/>
  <text class="wl" x="1100" y="569" fill="#d97706">EX/MEM forward</text>

  <path class="wb" d="M1295,410 L1295,590 L365,590 L365,385 L378,385"/>
  <path class="wb" d="M730,590 L730,462"/>
  <circle cx="730" cy="590" r="3" fill="#2563eb"/>
  <text class="wl" x="1110" y="604" fill="#2563eb">wdata → register file + MEM/WB forward</text>

  <path class="ct" d="M515,195 L515,118 L160,118 L160,308"/>
  <path class="ct" d="M302,118 L302,128"/>
  <path class="ct" d="M515,118 L602,118 L602,128"/>
  <text class="wl" x="330" y="113" fill="#dc2626">stall PC + IF/ID, bubble ID/EX</text>

  <path class="ct" d="M910,480 L910,612 L25,612 L25,340 L38,340"/>
  <path class="ct" d="M302,612 L302,562"/>
  <path class="ct" d="M602,612 L602,562"/>
  <text class="wl" x="640" y="626" fill="#dc2626">flush + redirect on mispredict</text>

  <path class="bp" d="M950,480 L950,645 L155,645 L155,542"/>
  <text class="wl" x="640" y="659" fill="#7c3aed">train PHT / BTB with real outcome</text>

  <!-- ================= legend ================= -->
  <g transform="translate(24,688)">
    <line x1="0" y1="0" x2="28" y2="0" stroke="#374151" stroke-width="1.6"/>
    <text class="wl" x="36" y="4">datapath</text>
    <line x1="120" y1="0" x2="148" y2="0" stroke="#d97706" stroke-width="1.8"/>
    <text class="wl" x="156" y="4">forwarding</text>
    <line x1="250" y1="0" x2="278" y2="0" stroke="#2563eb" stroke-width="1.8"/>
    <text class="wl" x="286" y="4">writeback</text>
    <line x1="370" y1="0" x2="398" y2="0" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="6 4"/>
    <text class="wl" x="406" y="4">hazard control</text>
    <line x1="510" y1="0" x2="538" y2="0" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="6 4"/>
    <text class="wl" x="546" y="4">branch prediction</text>
  </g>
</svg>
